[package]
name = "modex"
version = "0.1.0"
description = "Open-source desktop client powered by the Codex engine."
authors = ["Modex contributors"]
license = "MIT"
repository = "https://github.com/dzb7btdygv-hub/Modex"
edition = "2021"
rust-version = "1.81"

[lib]
name = "modex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-websocket = "2.4.2"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["time"] }
url = "2.5.8"
