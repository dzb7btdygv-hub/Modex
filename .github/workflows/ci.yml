name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Native SwiftUI app — the shipping product. Requires the macOS 26 SDK
  # (Xcode 26), which is newer than current hosted runners, so this job is kept
  # non-blocking (continue-on-error) until GitHub provides such an image. Flip
  # continue-on-error off once `xcode-select -p` points at Xcode 26+.
  macos-app:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      # actions/checkout v5.0.1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: brew install xcodegen
      - run: npm ci
      - run: npm run prepare:codex
      - run: xcodegen generate --spec macos/project.yml --project macos
      - name: Build & test native app
        run: |
          xcodebuild test \
            -project macos/Modex.xcodeproj \
            -scheme Modex \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath macos/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

  # Legacy Tauri client (src/, src-tauri/). Not the shipping product, but still
  # validated; also exercises the shared `npm run prepare:codex` engine fetch.
  legacy-tauri:
    runs-on: macos-latest
    steps:
      # actions/checkout v5.0.1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run prepare:codex
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
